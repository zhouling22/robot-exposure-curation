[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-exposure-curation"
version = "0.1.0"
description = "Source-only adapters for auditing training exposure in robot imitation learning"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Ling Zhou", email = ""},
  {name = "Chun Zhang", email = ""},
]
dependencies = ["numpy>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]
